<aux-modal [isOpen]="isOpen" [type]="'action'" [header]="copyModalHeader" [hasCustomFooter]="true">
    <div slot="content" class="modal-size-sm copy-column-options-modal--content">
        <div class="aux-layout__wrapper-32 column-to-copy">
            <div *ngIf="(columnsForCheckbox$ | async) as columnsForCheckbox">
                <div *ngIf="sourceColumnOptionMetaData.columnOptionTitle==='Display options'" class="copy-modal-note">
                    {{DISPLAY_OPTIONS_NOTE}}
                </div>
                <aux-checkbox-group
                    [isStacked]="true"
                    [label]="CHECK_BOX_TITLE"
                    [data]="columnsForCheckbox"
                    [instructionalText]="INSTRUCTIONAL_TEXT"
                    (checkboxChanged)="onColumnSelection($event)">
                </aux-checkbox-group>
            </div>
        </div>
    </div>
    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="APPLY_TEXT" [type]="'primary'" (click)="applyColumnOptionChanges()"></aux-button>
        <aux-button [label]="CANCEL_TEXT" [type]="'secondary'" (click)="closeModal()"></aux-button>
    </div>
</aux-modal>
