<aux-modal [isOpen]="isOpen" type="action" [header]="'Add Factors'" [hasGreyContentArea]="true" [hasCustomFooter]="true">
    <div slot="content" class="modal-size-xs widget-settings-modal-container">
        <div>Available Factors</div>
        <div class="text-info">Select factors to remove from the total return</div>
        <div class="factor-list">
            <aux-picklist #auxPickList
                          [hasSearch]="false"
                          [hasSelectedOnly]="false"
                          [hasExpandedItems]="true"
                          [hasParentCheckbox]="true"
                          [sourceData]="nonExcessFactors">
            </aux-picklist>
        </div>
    </div>
    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="DONE_TEXT" (click)="closeAndSetFactors()"></aux-button>
        <aux-button [label]="CLOSE_TEXT" [type]="'secondary'" (click)="closeModal()"></aux-button>
    </div>
</aux-modal>
