
<!--Name scenario multi select option-->
<ng-container  *ngIf="!allowNamedScenarioSingleSelection; else showSingleSelect ">
    <div style="height: 300px">
        <aux-picklist #auxPickList
                      [sourceData]="availableScenariosForPicklist"
                      [targetData]="selectedScenarios"
                      [hasAggregator]="true"
                      [hasSearch]="true"
                      [hasDragAndDrop]="true"
                      [hasReorder]="true"
                      [hasSelectedOnly]="false"
                      [hasRemoveAll]="true"
                      [hasDoubleClick]="true"
                      [sourceLabel]="'Stress scenarios'"
                      [targetLabel]="'&nbsp;'"
                      (targetItemMoved)="updateSelectedScenarios()"
                      (sourceItemMoved)="updateSelectedScenarios()"
                      (itemMovedDoubleClicked)="updateSelectedScenarios()"
                      (removeAllItemsClicked)="updateSelectedScenarios()"
                      (reOrderUpClicked)="updateSelectedScenarios()"
                      (reOrderDownClicked)="updateSelectedScenarios()">
        </aux-picklist>
    </div>
</ng-container>

<!--Name scenario single select option-->
<ng-template #showSingleSelect >
    <div class="aux-g16--xs-6 aux-g16--sm-6 aux-g16--md-6 aux-g16--lg-6 aux-g16--xl-6">
        <aux-select
            [label]="'Stress scenarios'"
            [hasInitialOptionPlaceholder]="false"
            [data]="availableScenariosForCombobox"
            [type]="'filter-simple'"
            (selectionChanged)="updateScenarioListFromCombobox($event.detail.value)">
        </aux-select>
    </div>
</ng-template>

<div class="padding-top-16">
    <explore-core-date-picker [label]="'User defined scenario lookback'"
                              [dateObject]="lookBackDate"
                              (dateChange)="onDateChange($event)"
                              [isLeftLabel]="false"
                              [closeCalendarOnBlur]="false">
    </explore-core-date-picker>
</div>
