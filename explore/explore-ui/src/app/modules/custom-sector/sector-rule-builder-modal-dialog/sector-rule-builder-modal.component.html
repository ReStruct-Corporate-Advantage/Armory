<aux-modal *ngIf="isDialogOpen"
           [isOpen]="isDialogOpen" [type]="'action'" [header]="sectorRuleBuilderConfig ? sectorRuleBuilderConfig.header : ''"
           [hasGreyContentArea]="false" [hasCustomFooter]="true">
    <div slot="content" class="aux-g16--cw-8 sector-rule-builder" *ngIf="isDialogOpen">
        <ng-container *ngIf="sectorRuleBuilderConfig && sectorRuleBuilderConfig.showFundSectoringTabs && !sectorRuleBuilderConfig.islookThroughRule">
            <aux-tab-bar tabType="modern"
                         [widthType]="'full'"
                         class="tab-group-container"
                         [customPadding]="32"
                         [data]="customSectorTypesTabData"
                         [activeUid]="activeTabIndex.toString()"
                         [selectCallback]="openSwitchTabDialog"
                         (tabBarItemSelected)="onTabSelected($event)">
            </aux-tab-bar>
            <div  class="rule-content-container">
                <ng-container [ngSwitch]="activeTabIndex">
                    <explore-sector-attribute-rule-builder *ngSwitchCase="0"
                                                           [sectorRuleBuilderConfig]="sectorRuleBuilderConfig"
                                                           [columnSectorRule]="rule">
                    </explore-sector-attribute-rule-builder>
                    <app-fund-sectoring-rule-builder *ngSwitchCase="1"
                                                     [sectorRuleBuilderConfig]="sectorRuleBuilderConfig"
                                                     [rule]="rule"
                                                     [customSectorType]="ruleCustomSectorType">
                    </app-fund-sectoring-rule-builder>
                    <app-fund-sectoring-rule-builder *ngSwitchCase="2"
                                                     [sectorRuleBuilderConfig]="sectorRuleBuilderConfig"
                                                     [rule]="rule"
                                                     [customSectorType]="ruleCustomSectorType">
                    </app-fund-sectoring-rule-builder>
                    <app-fund-sectoring-rule-builder *ngSwitchCase="3"
                                                     [sectorRuleBuilderConfig]="sectorRuleBuilderConfig"
                                                     [rule]="rule"
                                                     [customSectorType]="ruleCustomSectorType">
                    </app-fund-sectoring-rule-builder>
                </ng-container>
            </div>
        </ng-container>
        <div class="rule-content-container"
             *ngIf="sectorRuleBuilderConfig && !sectorRuleBuilderConfig.showFundSectoringTabs">
            <explore-sector-attribute-rule-builder [sectorRuleBuilderConfig]="sectorRuleBuilderConfig"
                                               [columnSectorRule]="rule">
            </explore-sector-attribute-rule-builder>
        </div>
    </div>
    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="'Done'" [type]="'primary'" (click)="onDone()"></aux-button>
        <aux-button [label]="'Cancel'" [type]="'secondary'" (click)="onCancelClick()"></aux-button>
    </div>
</aux-modal>
