<aux-modal [isOpen]="isOpen" type="action" [header]="jobExecutionHistory[0].getJobName() + ' History'" [hasCustomFooter]="true">
    <div slot="content" class="aux-g16--cw-10 aux-layout__wrapper-16 modal-size-md">
        <div class="refresh-history">
            <aux-button icon="refresh" [type]="AuxButtonTypeEnum.TERTIARY" label="Refresh History" (click)="refreshHistory()"></aux-button>
        </div>
        <div class="table-section">
            <export-hub-table [fontSize]="fontSize" [paddingSize]="paddingSize" [gridOptions]="gridOptions"
                              [rowData]="rowData"></export-hub-table>
        </div>
    </div>
    <div slot="custom-footer" class="custom-footer-container--one-button">
        <aux-button label="Close" type="secondary" (click)="closeModal()"></aux-button>
    </div>
</aux-modal>
