<aux-modal [isOpen]="isOpen" header="Schedule a Job" type="action" [isLarge]="true" [hasGreyContentArea]="true" [hasCustomFooter]="true">
    <div #contentWrapper slot="content" class="aux-g16--cw-10 aux-layout__wrapper-16 modal-size-md content-height content-padding-schedule-modal">
        <div class="progress-stepper data-sections">
            <div class="aux-g32--xs-12 aux-g32--sm-12 aux-g32--md-12 aux-g32--lg-12 aux-g32--xl-12">
                <aux-progress-stepper type="button" [steps]="jobSchedulingSteps"> </aux-progress-stepper>
            </div>
        </div>
        <div class="data-sections-wrapper">
            <ng-container *ngIf="currentStep === ScheduleJobSteps.PORTFOLIOS_AND_WIDGETS">
                <app-job-portfolios
                    #jobPortfoliosComponent
                    class="portfolio-section data-sections "
                    [portfolioConfigs]="exportHubJob.getJobPortfoliosList()"
                    (portfolioConfigsChange)="portfolioChangeHandler($event)"
                >
                </app-job-portfolios>
                <app-job-widgets
                    class="widgets-section data-sections "
                    [scheduledJob]="exportHubJob"></app-job-widgets>
            </ng-container>
            <ng-container *ngIf="currentStep === ScheduleJobSteps.SCHEDULE">
                <app-schedule-settings [exportHubJob]="exportHubJob" [(validatorCallback)]="validatorCallback" class="portfolio-section data-sections content-padding-schedule-settings-modal"></app-schedule-settings>
            </ng-container>
            <ng-container *ngIf="currentStep === ScheduleJobSteps.SETTINGS">
                <app-job-export-settings class = "data-sections-padding" [(validatorCallback)]="validatorCallback" [scheduledJobConfig] = "exportHubJob"></app-job-export-settings>
            </ng-container>
            <ng-container *ngIf="currentStep === ScheduleJobSteps.REVIEW">
                <app-job-review-settings style="width: inherit" [exportHubJob]="exportHubJob" (currentStepEmitter)="currentStepChangeHandler($event)"></app-job-review-settings>
            </ng-container>
        </div>
    </div>
    <div slot="custom-footer" class="custom-footer-container--three-buttons">
        <div>
            <aux-button [type]="'tertiary'" [label]="'Back'" [isDisabled]="currentStep == ScheduleJobSteps.PORTFOLIOS_AND_WIDGETS" (click)="backStep()"></aux-button>
        </div>
        <div>
            <aux-button class="custom-footer--primary-button" [label]="nextButtonLabel" (click)="nextStep()"></aux-button>
            <aux-button [label]="'Cancel'" [type]="'secondary'" (click)="closeScheduleJobModal()"></aux-button>
        </div>
    </div>
</aux-modal>
