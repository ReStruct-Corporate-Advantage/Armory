<aux-modal [isOpen]="isOpen" type="action" [header]="MODAL_TITLE" [hasCustomFooter]="true">
    <div slot="content" class="modal-size-sm api-request-modal--content">
        <div class="aux-layout__wrapper-32 api-request-type">
            <div class="aux-g32--xs-12 aux-g32--sm-12 aux-g32--md-12 aux-g32--lg-12 aux-g32--xl-12">
                <ng-container *ngIf="!isGenerateApiRequestSupported">
                    <aux-notification class="unsupported-notification" [message]="unsupportedMessage"
                                      [showCloseIcon]="false"
                                      [notificationStyle]="AuxNotificationStyleEnum.WARNING"></aux-notification>
                </ng-container>
                <ng-container *ngIf="isGenerateApiRequestErrored">
                    <aux-notification class="unsupported-notification" [message]="errorMessage"
                                      [showCloseIcon]="false"
                                      [notificationStyle]="AuxNotificationStyleEnum.ERROR"></aux-notification>
                </ng-container>
                <ng-container *ngIf="!isGenerateApiRequestErrored && isGenerateApiRequestSupported">
                    <div class="aux-bold">  {{apiEndpoint}}   </div>
                </ng-container>
                <aux-radio-group [isStacked]="true" [label]="FORMAT_TYPE_LABEL" [data]="apiRequestFormats"
                                 (radioGroupChanged)="onFormatSelection($event)"></aux-radio-group>
            </div>
        </div>
        <div class="aux-layout__wrapper-32 api-request-body">
            <div class="aux-g32--xs-12 aux-g32--sm-12 aux-g32--md-12 aux-g32--lg-12 aux-g32--xl-12">
                <div class="api-request-body--text">{{apiRequestJson}}</div>
            </div>
        </div>
    </div>
    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="COPY_TEXT" [type]="'primary'" [isDisabled]="!isGenerateApiRequestSupported"
                    (click)="copyToClipboard()"></aux-button>
        <aux-button [label]="CANCEL_TEXT" [type]="'secondary'" (click)="closeModal()"></aux-button>
    </div>
</aux-modal>
