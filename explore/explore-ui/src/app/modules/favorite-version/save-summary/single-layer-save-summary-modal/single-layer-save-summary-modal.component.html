<aux-modal [isOpen]="'isOpen'" [header]="'Save Enterprise ' + favType" [type]="'action'" [hasGreyContentArea]="true" [hasCustomFooter]="true">
    <div slot="content" class="modal-content aux-g16--cw-10 aux-layout__wrapper-32">
        <div class="aux-g32--xs-12 aux-g32--sm-12 aux-g32--md-12 aux-g32--lg-12 aux-g32--xl-12 saving-container">
            <div class="save-nested-changes">
                <div class="root-save-card">
                    <ng-container>
                        <div class="save-details">
                            <aux-text-input [placeholder]="'Maximum word count 180 characters'" [isRequired]="true"
                                [label]="'Please provide a brief summary of changes made'" (valueChanged)="saveSummaryUpdated($event)"
                                [maxLength]="FavoriteVersionConstants.SAVE_SUMMARY_MAX_TEXT_LENGTH">
                            </aux-text-input>
                        </div>
                        <div class="save-summary">
                            <aux-text-area [label]="'If you would like to add more detail, please provide below (Optional)'"
                                           (valueChanged)="saveSummaryDetailsUpdated($event)" [placeholder]="'Enter text here'" [maxLength]="FavoriteVersionConstants.SAVE_SUMMARY_DETAILS_MAX_TEXT_LENGTH">
                            </aux-text-area>
                        </div>
                    </ng-container>
                </div>
            </div>
    </div>
    </div>
    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button"
                    [label]="CoreCommonConstants.BUTTON_TEXT.SAVE"
                    [type]="AuxButtonTypeEnum.PRIMARY"
                    [isDisabled]="saveButtonDisabled$ | async"
                    (click)="updateFavoritesTreeWithSaveSummary()">
        </aux-button>
        <aux-button [label]="CoreCommonConstants.BUTTON_TEXT.CLOSE" [type]="AuxButtonTypeEnum.SECONDARY" (click)="cancelSaveSummaryInput()"></aux-button>
    </div>
</aux-modal>
