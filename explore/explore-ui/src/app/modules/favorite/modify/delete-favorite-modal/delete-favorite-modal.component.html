<aux-modal [isOpen]="isOpen" class="save-favorite-modal-area" type="action" [hasCustomHeader]="true" [hasCustomFooter]="true">
    <div slot="custom-header" class="custom-header">
        <span class="header-title">Delete {{favDisplayName}}</span>
    </div>

    <div slot="content">
        <div class="container aux-g16--cw-4" *ngIf="(selectedUser$ | async) as selectedUser">
            <div class="save-favorite-contents contents-height">
                <div class="favorite-search-field-area" [ngClass]="{'sticky-search aux-container': stickySearch}">
                    <aux-search-field
                            placeholder="{{favDisplayName | favoriteTitle: 'Search'}}"
                            [hasAdvancedSearch]="false"
                            [hasSelectAll]="false"
                            (searchValueChanged)="onSearchValueChanged($event)">
                    </aux-search-field>
                </div>

                <ng-container>
                    <div class="save-favorite-item">
                        <aux-select [label]="'Type'"
                                    [hasInitialOptionPlaceholder]="false"
                                    (selectionChanged)="updateFavoriteOwner($event)"
                                    [data]="favoriteOwnerOption">
                        </aux-select>
                    </div>
                </ng-container>

                <ng-container *ngIf="favType">
                    <app-favorite-tree-delete-mode [favType]="favType"
                                                   [favTreeType]="favTreeType"
                                                   [favDisplayName]="favDisplayName"
                                                   [favoriteTreeOwner$]="selectedUser$"
                                                   [updateFavoriteTreeStructure$]="updateFavoriteTreeStructure$"
                                                   [favoriteSearchTermSubject$]="favoriteSearchTermSubject$"
                                                   [selectedFavoriteNode$]="selectedFavoriteNode$">
                    </app-favorite-tree-delete-mode>
                </ng-container>
            </div>
        </div>
    </div>
    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button"
                    [label]="BUTTON_TEXT.DELETE"
                    [isDisabled]="isDeleteButtonDisabled"
                    (click)="onDeleteButtonClicked()">
        </aux-button>
        <aux-button
                    [type]="'secondary'"
                    [label]="BUTTON_TEXT.CLOSE"
                    (click)="closeModal()">
        </aux-button>
    </div>
</aux-modal>
