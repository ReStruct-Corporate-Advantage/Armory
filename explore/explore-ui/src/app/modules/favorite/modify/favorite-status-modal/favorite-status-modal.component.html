<aux-modal [isOpen]="isOpen" type="action" header="Update Status" [hasGreyContentArea]="false" [hasCustomFooter]="true">
    <div slot="content" class="compare-modal update-status-modal-size content-padding">
        <aux-radio-group
            isStacked="true"
            [data]="statusOptions"
            (radioGroupChanged)="statusChanged($event.detail.value)">
        </aux-radio-group>
    </div>

    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="UPDATE_TEXT" (click)="updateButtonClicked()" [isDisabled]="selectedStatus === favorite?.statusTag?.toLowerCase()"></aux-button>
        <aux-button [label]="CANCEL_TEXT" type="secondary" (click)="closeModal()"></aux-button>
    </div>
</aux-modal>
