<aux-modal [isOpen]="isOpen" class="save-favorite-modal-area" type="action" [hasCustomHeader]="true"
           [hasCustomFooter]="true">
    <div slot="custom-header" class="custom-header">
        <span class="header-title">{{modalTitle}}</span>
    </div>

    <div slot="content">
        <div class="container aux-g16--cw-4">
            <div class="favorite-contents contents-height">
                <div class="favorite-title favorite-content">
                    <span class="disabled_colored_label">Title</span><br>
                    <span class="aux-bold">{{favoriteTitle}}</span>
                </div>
                <div *ngIf="(selectedUser === CoreFavoriteConstants.ADMIN) && !isModalRootItem" class="favorite-content">
                    <app-favorite-permission-group [selectedPermissionGroups]="selectedPermissionGroups" (permissionGroupsChanged)="onPermissionGroupsSelected($event)"></app-favorite-permission-group>
                </div>

                <ng-container *ngIf="isACEPermissionFeatureEnabled && !isModalRootItem">
                    <app-favorite-permission #favoritePermission [favoriteChange]="favoriteChange">
                    </app-favorite-permission>
                </ng-container>

                <div *ngIf="(selectedUser === CoreFavoriteConstants.ADMIN) && !isModalRootItem" class="favorite-content">
                    <aux-text-input #favoriteDescriptionTextInput
                                    [label]="'Description'"
                                    [placeholder]="'140 characters max'"
                                    class="save-description"
                                    [value]="favoriteChange.enterpriseDescription"
                                    (valueChanged)="updateFavoriteDescription($event)"
                                    [maxLength]="140">
                    </aux-text-input>
                </div>

                <ng-container *ngIf="isFolderSelectionRequiredEnabled && selectedUser == CoreFavoriteConstants.ADMIN">
                    <div class="favorite-informational-text">
                        All Enterprise {{CoreFavoriteConstants.FAVORITE_DISPLAY_NAMES[favoriteDisplayType]}} need to be assigned to a folder. Please select a folder.
                    </div>
                </ng-container>
                <app-folder-favorite-tree #favoriteFolderStructure
                                          [favoriteChange]="favoriteChange"
                                          [selectedUser]="selectedUser"
                                          (folderSelected)="onFolderSelected($event)"
                                          (folderTreeLoaded)="onFolderTreeLoaded($event)">
                </app-folder-favorite-tree>
            </div>
        </div>
    </div>

    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button"
                    [label]="CoreCommonConstants.BUTTON_TEXT.APPLY"
                    [isDisabled]="isApplyButtonDisabled"
                    (click)="applyFolderChanges()">
        </aux-button>
        <aux-button [type]="'secondary'"
                    [label]="CoreCommonConstants.BUTTON_TEXT.CANCEL"
                    (click)="closeModal()">
        </aux-button>
    </div>
</aux-modal>
