<aux-modal [isOpen]="isOpen" type="action" header="Multi-Portfolio Analysis" [hasGreyContentArea]="false" [hasCustomFooter]="true">
    <div slot="content" class="compare-modal compare-modal-size content-padding">
		<div class="compare-table">
            <div class="compare-toggle-container">
                <div class="compare-toggle inline-flex">
                    <span class="aux-primary-text__color inline-flex">Enable Multi-Portfolio Analysis</span>
                    <div class="inline-flex">
                        <aux-popover [trigger]="'hover'" hasCloseIcon="false">
                            <aux-button type="tertiary-subtle" icon="info-bold" assistiveText="Button" slot="target"></aux-button>
                            <div slot="content" class="custom-popover-container">
                                Multi-Portfolio Analysis compares your selected portfolios side-<br>
                                by-side in a given report, providing you the ability to understand<br>
                                your analytics across multiple portfolios in one view.
                            </div>
                        </aux-popover>
                    </div>
                    <aux-toggle [isChecked]="isComparisonEnabled"
                                (toggleChanged)="onComparisonToggleChanged($event)">
                    </aux-toggle>
                </div>


            </div>

            <app-multi-portfolio-analysis-content
                label="Choose portfolios for Multi-Portfolio Analysis"
                [comparisonStackedData]="comparisonStackedData"
                [isStacked]="true"
                [hasSelectAll]="true"
                [isDisabled]="!isComparisonEnabled"
                [anchorOptions]="anchorOptions"
                [isComparisonListEmpty$]="isComparisonListEmpty$"
                [isComparisonEnabled]="isComparisonEnabled"
                (checkboxGroupChanged)="onCheckboxGroupChanged()"
                (setSelectedAnchorValue)="setSelectedAnchorValue($event)">
            </app-multi-portfolio-analysis-content>
        </div>
	</div>
    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="APPLY_TEXT" [type]="'primary'" (click)="applyModal($event)"></aux-button>
        <aux-button [label]="CANCEL_TEXT" [type]="'secondary'" (click)="cancelCompareChange()"></aux-button>
    </div>
</aux-modal>
