<aux-modal [isOpen]="isOpen" type="action" header="Apply Report Group Date" [hasCustomFooter]="true">
    <div slot="content" class="workspace-date-modal-size content-container">
        <div class="pre-text">Apply a new date to all portfolios in this report group</div>
        <explore-core-date-picker
            [dateObject]="dateValueObject"
            (dateChange)="onDateChange($event)">
        </explore-core-date-picker>
    </div>
    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="'Apply'" [type]="'primary'" (click)="onDoneClicked()"></aux-button>
        <aux-button [label]="'Close'" [type]="'secondary'" (click)="closeModal()"></aux-button>
    </div>
</aux-modal>
