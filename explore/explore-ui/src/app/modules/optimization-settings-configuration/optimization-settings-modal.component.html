<aux-modal type="action" [header]="modalHeader" [hasGreyContentArea]="false" [isOpen]="isOpen" [hasCustomFooter]="true">
    <div slot="content" class="optimization-settings aux-g16--cw-10">
        <aux-tab-bar tabType="modern" class="tab-group-container" [activeUid]="activeIndex.toString()"
                     [customPadding]="32"
                     (tabBarItemSelected)="onTabSelected($event)" [data]="settingsTabData">
        </aux-tab-bar>
        <div class="tab-content-container">
            <ng-container #settingsTabsContainer></ng-container>
        </div>
    </div>
    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="'Done'" [type]="'primary'" (click)="closeModal(true)"></aux-button>
        <aux-button [label]="'Cancel'" [type]="'secondary'" (click)="closeModal(false)"></aux-button>
    </div>
</aux-modal>
