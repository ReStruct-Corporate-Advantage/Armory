<aux-modal [type]="'action'" [header]="'Maximize Alpha Score Measures'" [isOpen]="showColumnMeasures" [hasCustomFooter]="true">
    <div slot="content" style="height: 57vh; width: 80vw; padding: 32px;">
        <app-column-set-settings
            [columnTree]="columnTree"
            [widgetConfigInput]="widgetConfigInput"
            [restrictedColumnOptions]="restrictedColumnOptions"
            [inputs]="inputs"
            [widgetType]="widgetType"
            [singleSelectionAllowed]="true"
            [requireLoadAndSaveOptions]="false"
            [isApplyButtonDisabled]="isApplyButtonDisabled"
            [customCalcFavoriteType]="customCalcFavoriteType"
            sourceLabel="Column Measures"
            targetLabel="Column Set">
        </app-column-set-settings>
    </div>
    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="'Apply'" [type]="'primary'" (click)="closeColumnMeasuresModal(true)"></aux-button>
        <aux-button [label]="'Cancel'" [type]="'secondary'" (click)="closeColumnMeasuresModal(false)"></aux-button>
    </div>
</aux-modal>
