<aux-modal [type]="'action'" [header]="'Add/Edit Alpha'" [hasGreyContentArea]="false" [isOpen]="isOpen" [hasCustomFooter]="true">
    <div slot="content" class="aux-g16--cw-6 upload-alpha">
        <app-security-search-with-custom-col-def [selectedSecurities]="selectedSecurities"
                                                 [createFromScratch]="true"
                                                 [customColConfig]="colConfigForSecuritySearch">
        </app-security-search-with-custom-col-def>
    </div>
    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="'Done'" [type]="'primary'" (click)="onClosed(true)"></aux-button>
        <aux-button [label]="'Cancel'" [type]="'secondary'" (click)="onClosed(false)"></aux-button>
    </div>
</aux-modal>
