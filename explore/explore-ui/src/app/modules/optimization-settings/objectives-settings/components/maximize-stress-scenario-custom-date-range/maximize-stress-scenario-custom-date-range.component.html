<aux-modal [type]="'action'"
           [header]="'Edit Custom Date Range'"
           [hasGreyContentArea]="false"
           [isOpen]="isOpen"
           [hasCustomFooter]="true">
    <div slot="content" class="aux-g16--cw-6 modal-content">
        <ng-container *ngIf="isNewStressScenarioEnabled else oldDateScenario">
            <explore-extended-column-option-date-range-scenario [scenario]="stressScenario"
                                                                [showSpinner$]="showSpinner$"
                                                                [validateScenario]="validateStressScenario"
                                                                (scenarioValidatedEmitter)="validateStressScenarioHandler($event)">
            </explore-extended-column-option-date-range-scenario>
        </ng-container>

        <ng-template #oldDateScenario>
            <explore-core-date-scenario
                [scenarios]="dateRangeScenarios"
                [disableAddDateScenarioButton]="true"
                [disableCheckbox]="true">
            </explore-core-date-scenario>
        </ng-template>
    </div>

    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button"
                    [isDisabled]="(isApplyButtonDisabled.value != 0 || (showSpinner$ | async))"
                    [label]="'Done'" (click)="onClosed(true)"></aux-button>
        <aux-button [label]="'Cancel'" [type]="'secondary'" (click)="onClosed(false)"></aux-button>
    </div>
</aux-modal>
