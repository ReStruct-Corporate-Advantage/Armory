<aux-modal type="action"
           header="Define Look-Through Logic"
           [hasCustomFooter]="true"
           [isOpen]="showRuleBuilder"
           [hasGreyContentArea]="true">
    <div slot="content" class="aux-g32--cw-8 content-container">
        <div class="aux-layout__wrapper-without-margin">
            <div class="aux-g16--xs-4 aux-g16--sm-4 aux-g16--md-4 aux-g16--lg-4 aux-g16--xl-4 margin-zero">
                <div class="flex-div flex-justified-space-bet">
                    <div>Look-Through Rules</div>
                    <div class="flex-div flex-justified-flex-end button-margin-right">
                        <div class="button-margin">
                            <aux-button type="tertiary" label="Add Rule" (click)="addNewLogicRule($event)"></aux-button>
                        </div>
                        <div class="category-delimiter"></div>
                        <div class="button-margin">
                            <aux-button type="tertiary"
                                        label="Clear All"
                                        (click)="clearFilterList()"
                                        [isDisabled]="!portfolio.lookthroughSettings.ltFilterRulesFav || !portfolio.lookthroughSettings.ltFilterRulesFav.ltFilterRules || portfolio.lookthroughSettings.ltFilterRulesFav.ltFilterRules.length === 0">
                            </aux-button>
                        </div>
                    </div>
                </div>
                <div class="row1">
                    <app-lookthrough-rule-table [lookthroughFilterRules]="portfolio.lookthroughSettings.ltFilterRulesFav.ltFilterRules"
                                                [selectedRule]="selectedFilterRule"
                                                (itemSelected)="updateSelectedFilterRule($event)"
                                                (itemEnabledDisabled)="setLookthroughViewFlags(false, false, true, false)"
                                                (itemDeleted)="removeFilterFromList($event)">
                    </app-lookthrough-rule-table>
                </div>
            </div>
            <ng-container *ngIf="portfolio.lookthroughSettings.ltFilterRulesFav && portfolio.lookthroughSettings.ltFilterRulesFav.ltFilterRules && portfolio.lookthroughSettings.ltFilterRulesFav.ltFilterRules.length > 0">
                <div class="aux-g16--xs-8 aux-g16--sm-8 aux-g16--md-8 aux-g16--lg-8 aux-g16--xl-8 margin-custom">
                    <div class="flex-div">
                        <div class="col1">
                            <aux-text-input
                                label="Rule name"
                                (valueChanged)="onRuleNameChange($event.detail.value)"
                                [value]="selectedFilterRule.displayName"
                                hasClearButton=true
                                placeholder="Rule Display Name">
                            </aux-text-input>
                        </div>
                        <div class="ltType">
                            <aux-select label="Type"
                                        [hasInitialOptionPlaceholder]="false"
                                        [data]="displayDataForLtTypes"
                                        (selectionChanged)="changeLtType($event.detail.value.value)">
                            </aux-select>
                        </div>
                    </div>

                    <div class="flex-div flex-justified-space-bet clear-logic button-margin-right">
                        <div>Rule Definition</div>
                        <div class="button-margin">
                            <aux-button label="Clear All" type="tertiary" (click)="clearFilter()"></aux-button>
                        </div>
                    </div>
                    <div class="row1">
                        <explore-custom-sector-item #customSectorItem
                                                    [rule]="selectedFilterRule.customSector.rule"
                                                    [parent]="selectedFilterRule.customSector"
                                                    [groupIndex]="0"
                                                    [sectorRuleBuilderConfig]="sectorRuleBuilderConfig"
                                                    [editableRuleConfig]="editableRuleConfig"
                                                    ruleCaption="Double click to define {{LT_WITH_SMALL_L}} rule">
                        </explore-custom-sector-item>
                    </div>
                </div>
            </ng-container>
        </div>
        <br/>
        <div class="flex-div flex-justified-space-bet">
            <div class="look-through-summary-header">Look-Through Summary</div>
            <div class="look-through-table-options">
                <aux-button class="look-through-refresh-button" size="small" type="tertiary-subtle" icon="widget-refresh"
                            title="Refresh"  [isDisabled]="!portfolio.lookthroughSettings.isAnyLookthroughEnabled()"
                            (click)="extractLookthroughInfo()">
                </aux-button>
                <aux-inline-menu class="look-through-refresh-button"
                                 type="tertiary-subtle"
                                 [data]="exportOptions"
                                 [isActive]="portfolio.lookthroughSettings.isAnyLookthroughEnabled()"
                                 trigger="pressed"
                                 (inlineMenuItemClicked)="onExportItemClicked($event.detail.element.eventData)">
                    <aux-button [isDisabled]="!portfolio.lookthroughSettings.isAnyLookthroughEnabled()" size="small" type="tertiary-subtle" icon="widget-export" slot="target" title="Export"
                                data-name="Export" eventData="export">
                    </aux-button>
                </aux-inline-menu>
                <aux-icon *ngIf="exportingInProgress" class="look-through-refresh-button"
                          type="loading" title="Export in progress" state="primary">
                </aux-icon>
                <aux-button class="look-through-search-button" size="small" type="tertiary-subtle" icon="search"
                            title="Search"  [isDisabled]="!portfolio.lookthroughSettings.isAnyLookthroughEnabled()"
                            [type]="(isTableSearchActive$ | async) ? 'tertiary' : 'tertiary-subtle'"(click)="toggleTableSearch()">
                </aux-button>
                <aux-button class="look-through-add-condition-button"
                            size="small" type="tertiary"
                            [label]="'Add Condition'"
                            title="Add Condition"
                            [isDisabled]="isAddConditionEnabled"
                            (click)="addConditionClicked()">
                </aux-button>


            </div>
        </div>
        <div class="lt-settings-div6">
            <div *ngIf="refreshLookthroughData">
                <aux-notification-group
                        [mode]="LT_REFRESH_PUSH"
                        [type]="LT_REFRESH_TYPE"
                        [politeness]="LT_REFRESH_POLITENESS"
                        [openOnLoad]="true"
                        [config]="LT_REFRESH_MSG">
                </aux-notification-group>
            </div>
            <div *ngIf="showLookthroughView">
                <lookthrough-table-wrapper #exploreTableWrapper
                                           (changeAddConditionState)="enableAddCondition($event)"
                                           [widgetPayload]="widgetPayload"
                                           [widget]="widget"
                                           [isTableSearchActive$]="isTableSearchActive$">
                </lookthrough-table-wrapper>

                <p>If you would like to add a condition from the table, select one or more cells and click on "Add Condition"</p>

            </div>
            <div *ngIf="refreshInProgress">
                <app-loading-spinner size="large" loadingLabel="Loading {{LT_WITH_SMALL_L}} securities"></app-loading-spinner>
            </div>
        </div>
    </div>

    <div slot="custom-footer" class="modal-footer aux-border--top">
        <span class="lt-rule-save-warning" *ngIf="portfolio.lookthroughSettings.ltFilterRulesFav.id">
                    <strong>PLEASE NOTE:</strong> Saving changes here will affect all the reports currently using these {{LT_WITH_SMALL_L}} rules.
        </span>
        <aux-button *ngIf="!portfolio.lookthroughSettings.ltFilterRulesFav.id"
                    (click)="onSaveToMyRulesClick()"
                    class="modal-action-button"
                    label="Save to My Rules"
                    type="primary">
        </aux-button>
        <aux-button (click)="onDoneClick()"
                    class="modal-action-button"
                    [label]="portfolio.lookthroughSettings.ltFilterRulesFav.id ? 'Save Changes' : 'Use Once'"
                    type="primary">
        </aux-button>
        <aux-button (click)="onCancel()"
                    class="modal-action-button"
                    label="Cancel"
                    type="secondary">
        </aux-button>
    </div>
</aux-modal>
<ng-container *ngIf="isSaveSummaryOpen">
    <app-single-layer-save-summary-modal [isOpen]="isSaveSummaryOpen" [saveSummary]="saveSummary" [favType]="favType" (modalClosed)="closeSaveSummaryDialog($event)"></app-single-layer-save-summary-modal>
</ng-container>
