<aux-modal [isOpen]="isOpen" [type]="'action'" [header]="modalHeader" [hasCustomFooter]="true">
    <div slot="content" class="workspace-date-modal-size content-container">
        <div class="pre-text">Apply a new date to all portfolios in this workspace</div>
        <div>
            <explore-core-date-picker [dateObject]="updatedDate" (dateChange)="onDateChange($event)"></explore-core-date-picker>
        </div>
    </div>
    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="DONE_TEXT" [type]="'primary'" (click)="onDone()"></aux-button>
        <aux-button [label]="CLOSE_TEXT" [type]="'secondary'" (click)="closeModal()"></aux-button>
    </div>
</aux-modal>
