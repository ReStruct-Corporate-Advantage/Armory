<aux-modal [isOpen]="isOpen" type="action" [hasCustomHeader]="true" [hasCustomFooter]="true">
    <div slot="custom-header" class="custom-header aux-border--bottom">
        <span class="aux-bold aux-p20 title-padding">Add Factors</span>
    </div>

    <div slot="content" class="widget-settings-modal-container" [class]="modalSizeClass">
        <ng-container *ngIf="showSpinner$ | async">
            <div class="loading-spinner-factor-modal" [class]="modalSizeClass">
                <aux-progress-indicator [hasLabel]="true" [isSpinner]="true" [hasCounter]="true" progress="30"
                                        size="large"
                                        type="loading" [loadingLabel]="'Loading Factors'">
                </aux-progress-indicator>
            </div>
        </ng-container>

        <div class="tab-content--fixed-height" [hidden]="showSpinner$ | async">
            <explore-extended-factor-widget-column-set-settings [widgetConfigInput]="widgetConfigInput"
                                                                [inputs]="updatedInputs"
                                                                [restrictedColumnOptions]="restrictedColumnOptions"
                                                                [isColumnOptionsDisabled]="isColumnOptionsDisabled"
                                                                [isApplyButtonDisabled]="isApplyButtonDisabled"
                                                                [singleSelectionAllowed]="singleColumnOnly"
                                                                [showSpinner$]="showSpinner$"
                                                                [columnSelectorHeight]="columnSelectorHeight"
                                                                [showFactorViewLevelPerms]="showFactorViewLevelPerms"
                                                                [showCustomFactor]="showCustomFactor">
            </explore-extended-factor-widget-column-set-settings>
        </div>
    </div>

    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [isDisabled]="(isApplyButtonDisabled.value != 0 || (showSpinner$ | async))" label="Done" (click)="onDoneClicked()"></aux-button>
        <aux-button label="Cancel" type="secondary" (click)="closeModal(false)"></aux-button>
    </div>
</aux-modal>
