<aux-modal [isOpen]="isOpen" type="action" [hasCustomHeader]="true" [hasCustomFooter]="true">
    <div slot="custom-header" class="custom-header aux-border--bottom">
        <span class="aux-bold aux-p20 title-padding">Edit Factor Settings</span>
    </div>

    <div slot="content" class="modal-size-md widget-settings-modal-container ">
        <ng-container *ngIf="customTitleOption">
            <div [ngClass]="riskSettings ? 'custom-title-style margin-right-16' : 'custom-title-style'">
                <explore-custom-title-column-option
                    [option]="customTitleOption"
                    [column]="updatedColumn"
                ></explore-custom-title-column-option>
            </div>
        </ng-container>

        <ng-container *ngIf="riskSettings">
            <explore-risk-factor-data-widget-economy-risk-settings
                [economyRiskSettings]="riskSettings.economyRiskSettings"
                [editFactorSettings]="true"
                [isColumnOption]="true"
            >
            </explore-risk-factor-data-widget-economy-risk-settings>
        </ng-container>

        <ng-container *ngIf="fxFactorOption">
            <div [ngClass]="riskSettings ? 'padding-top-16' : 'layout-factor-column-option'">
                <explore-column-option
                    [optionType]="fxFactorOption.columnOptionConfigType"
                    [option]="fxFactorOption"
                    [column]="updatedColumn">
                </explore-column-option>
            </div>
        </ng-container>
    </div>
    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="'Done'" [type]="'primary'" (click)="onDoneClicked()"></aux-button>
        <aux-button [label]="'Cancel'" [type]="'secondary'" (click)="closeModal(false)"></aux-button>
    </div>
</aux-modal>
