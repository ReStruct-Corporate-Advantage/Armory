<aux-modal [isOpen]="isOpen" type="action" [header]="modalTitle" [hasCustomFooter]="true">
    <div slot="content" class="portfolio-modal__content" [ngClass]="{'type-portfolio aux-g16--cw-6' : portfolioType === portfolioTypeEnum.PORTFOLIO, 'type-index-what-if aux-g16--cw-8' : portfolioType === portfolioTypeEnum.INDEX_RESEARCH || portfolioType === portfolioTypeEnum.WHAT_IF}">
        <div class="add-portfolio-top-container" [ngClass]="{'no-overflow': portfolioType === portfolioTypeEnum.PORTFOLIO}" [ngSwitch]="portfolioType">
            <app-add-portfolio *ngSwitchCase="portfolioTypeEnum.PORTFOLIO" [allowPortUpload]="allowPortUpload" [uploadFileParsingLogic]="uploadFileParsingLogic"></app-add-portfolio>
            <app-add-what-if-portfolio *ngSwitchCase="portfolioTypeEnum.WHAT_IF" [loadFavActionCallback]="loadFavActionCallback"></app-add-what-if-portfolio>
            <app-add-custom-portfolio #customPortfolio *ngSwitchCase="portfolioTypeEnum.CUSTOM"></app-add-custom-portfolio>
            <app-add-index-research *ngSwitchCase="portfolioTypeEnum.INDEX_RESEARCH" (selectedPortfolioTickersChanged)="isAddButtonEnabled()"></app-add-index-research>
        </div>
        <ng-container *ngIf="!reportGroup">
            <app-add-group-button
                (addReportGroupDoneClicked)="addReportGroupDoneClickedCallback()">
            </app-add-group-button>
        </ng-container>
    </div>

    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="'Add'" [isDisabled]="!isAddButtonEnabled()" (click)="onAddClick()"></aux-button>
        <aux-button [label]="'Cancel'" [type]="'secondary'" (click)="closeModal()"></aux-button>
    </div>
</aux-modal>
