<aux-modal [isOpen]="true" [type]="'action'" [header]="title" [hasGreyContentArea]="false" [hasCustomFooter]="true">
    <div slot="content" class="create-multi-portfolio-analysis-modal-menu create-multi-portfolio-analysis-modal-menu-size content-padding">

        <div class="create-multi-portfolio-analysis-modal-container">
            <span class="aux-primary-text__color inline-flex">Multi-Portfolio Analysis compares your selected portfolios side-by-side in a given report, providing you the ability to understand your analytics across multiple portfolios in one view.</span>
            <span class="aux-primary-text__color inline-flex"></span>
            <br>
            <span class="aux-primary-text__color inline-flex"></span>
            <span class="aux-primary-text__color inline-flex">In order to use Multi-Portfolio Analysis, you must first create a Group and add at least 2 portfolios.</span>
        </div>

    </div>
    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="applyText" [type]="'primary'" (click)="onApplyClick()"></aux-button>
        <aux-button [label]="cancelText" [type]="'secondary'" (click)="onCancelClick()"></aux-button>
    </div>
</aux-modal>
