<aux-modal [isOpen]="isOpen" type="action" header="Multi-Portfolio Analysis" [hasGreyContentArea]="false" [hasCustomFooter]="true">
    <div slot="content" class="compare-modal compare-modal-size content-padding">
		<div class="compare-table">
            <div class="report-group-container"  *ngIf="isDropdownEnabled">
                <div class="report-group-label">
                    <span class="aux-primary-text__color">Select group for Multi-Portfolio Analysis</span>
                    <div class="inline-flex">
                        <aux-popover [trigger]="'hover'" hasCloseIcon="false">
                            <aux-button
                                type="tertiary-subtle"
                                icon="info-bold"
                                assistiveText="Button"
                                slot="target">
                            </aux-button>
                            <div slot="content" class="custom-popover-container" [innerHTML]="multiPortfolioAnalysisText"></div>
                        </aux-popover>
                    </div>
                </div>
                <div class="group-section">
                    <aux-select
                        [hasInitialOptionPlaceholder]="false"
                        (selectionChanged)="setSelectedReportGroupValue($event)"
                        [data]="reportGroupOptions">
                    </aux-select>
                    <div *ngIf="(comparisonStackedData.length < 2) && isGroupSelected" class="warning-text" [innerHTML]="multiPortfolioAnalysisTextWarning">
                    </div>
                </div>
            </div>
            <ng-container *ngIf="isGroupSelected">
            <div class="report-container">
                <div class="report-label">
                    <div *ngIf="isDropdownEnabled">
                        <span [ngClass]="(comparisonStackedData.length < 2) ? 'aux-disabled-text__color' : 'aux-primary-text__color'" class="aux-primary-text__color">Select Report</span>
                    </div>
                    <div *ngIf="!isDropdownEnabled">
                        <span [ngClass]="(comparisonStackedData.length < 2) ? 'aux-disabled-text__color' : 'aux-primary-text__color'" class="aux-primary-text__color">Select Report for Multi-Portfolio Analysis</span>
                        <div class="inline-flex">
                            <aux-popover [trigger]="'hover'" hasCloseIcon="false">
                                <aux-button
                                    type="tertiary-subtle"
                                    icon="info-bold"
                                    assistiveText="Button"
                                    slot="target">
                                </aux-button>
                                <div slot="content" class="custom-popover-container" [innerHTML]="multiPortfolioAnalysisText"></div>
                            </aux-popover>
                        </div>
                    </div>

                </div>
                <div class="report-section">
                    <aux-select
                        [hasInitialOptionPlaceholder]="false"
                        (selectionChanged)="setSelectedReportValue($event)"
                        [isDisabled]="(comparisonStackedData.length < 2)"
                        [data]="reportOptions">
                    </aux-select>
                </div>
            </div>


            <app-multi-portfolio-analysis-content
                label="Choose portfolios"
                [comparisonStackedData]="comparisonStackedData"
                [anchorOptions]="anchorOptions"
                [isStacked]="true"
                [hasSelectAll]="true"
                [isDisabled]="(comparisonStackedData.length < 2)"
                (checkboxGroupChanged)="onCheckboxGroupChanged()"
                [isComparisonListEmpty$]="isComparisonListEmpty$"
                [isComparisonEnabled]="isComparisonEnabled"
                (selectionChanged)="setSelectedAnchorValue($event)">
            </app-multi-portfolio-analysis-content>
        </ng-container>
        </div>
	</div>

    <div slot="custom-footer" class="custom-footer-container--two-buttons">
        <aux-button class="custom-footer--primary-button" [label]="APPLY_TEXT" (click)="applyModal()" [isDisabled]="!isGroupSelected || !isReportSelected"></aux-button>
        <aux-button [label]="CANCEL_TEXT" type="secondary" (click)="closeSelectGroupModalPortfolioMenuModal()"></aux-button>
    </div>
</aux-modal>
